<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keytrace</title>
  <!-- The app mark: the same artwork as the app icon (installer/make_icon.py). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232C7567'/%3E%3Cpath d='M9 9v14M14 9v14M19 9v14M24 9v14' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3Crect x='11' y='9' width='4' height='8' rx='1.2' fill='white'/%3E%3Crect x='20' y='9' width='4' height='8' rx='1.2' fill='white'/%3E%3C/svg%3E">
  <script>
    // Apply the saved appearance before the first paint, so a dark window never flashes light.
    // The window's origin changes every launch (random port), so the server copy is the one that counts.
    (function () {
      var a = null, fromServer = false;
      try {
        var x = new XMLHttpRequest();
        x.open('GET', '/api/settings', false);
        x.send();
        if (x.status === 200) { a = (JSON.parse(x.responseText) || {}).appearance; fromServer = true; }
      } catch (e) { /* not served by the app: fall back to the local copy */ }
      if (!fromServer) { try { a = (JSON.parse(localStorage.getItem('midiconv.settings.v1')) || {}).appearance; } catch (e) { /* none */ } }
      var dark = a === 'dark' || (a === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app" id="app" data-view="home">
    <header class="topbar">
      <a class="brand" href="#" id="home" aria-label="Keytrace, start over">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#2C7567"/>
          <path d="M9 9v14M14 9v14M19 9v14M24 9v14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
          <rect x="11" y="9" width="4" height="8" rx="1.2" fill="#fff"/>
          <rect x="20" y="9" width="4" height="8" rx="1.2" fill="#fff"/>
        </svg>
        <span class="wordmark" aria-hidden="true">Key<span class="wordmark-trace">trace</span></span>
      </a>
      <div class="gpu" id="device" tabindex="0" hidden>
        <span class="gpu-dot" aria-hidden="true"></span>
        <span id="deviceName"></span>
      </div>
    </header>

    <main class="main">
      <!-- Home -->
      <section class="view view-home" id="viewDrop" aria-label="Convert a recording">
        <label class="drop" id="dropzone" tabindex="0" role="button" aria-describedby="dropFormats">
          <input type="file" id="fileInput" hidden
                 accept="audio/*,video/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.oga,.opus,.wma,.aif,.aiff,.alac,.webm,.mp4,.mkv,.mov">
          <span class="drop-inner">
            <span class="drop-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48"><path class="arrow" d="M24 9v20M16 21l8 8 8-8"/><path d="M10 31v4a4 4 0 0 0 4 4h20a4 4 0 0 0 4-4v-4"/></svg>
            </span>
            <span class="drop-title">Drop a recording here</span>
            <span class="drop-sub">or <span class="drop-link">choose a file</span></span>
            <span class="drop-formats" id="dropFormats">MP3 · WAV · FLAC · M4A · OGG · video</span>
          </span>
          <span class="drop-release" aria-hidden="true">Let go to convert</span>
        </label>

        <div class="setline">
          <div class="setline-right">
            <button class="engine-sum" id="settingsLine" type="button" aria-haspopup="dialog" aria-controls="drawer" title="Change in Options"></button>
            <button class="link-btn" id="openAdvanced" type="button" aria-haspopup="dialog" aria-controls="drawer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>
              Options
            </button>
          </div>
        </div>

        <section class="recent" id="recent" aria-labelledby="recentTitle" hidden>
          <div class="recent-head">
            <h2 id="recentTitle">Recent conversions</h2>
            <button class="link-btn recent-more" id="recentMore" type="button" aria-expanded="false" aria-controls="recentList">Show all</button>
          </div>
          <ul class="recent-list" id="recentList"></ul>
        </section>
      </section>

      <!-- Progress -->
      <section class="view view-progress" id="viewProgress" hidden aria-label="Converting">
        <div class="prog" id="prog">
          <div class="ring" id="ring" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="progTitle">
            <svg viewBox="0 0 240 240" aria-hidden="true">
              <circle class="ring-track" cx="120" cy="120" r="108"/>
              <circle class="ring-fill" id="ringFill" cx="120" cy="120" r="108"/>
            </svg>
            <div class="ring-label" aria-hidden="true"><span id="progressPct">0</span><small id="pctSign">%</small></div>
          </div>
          <span class="err-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.4v.1"/></svg>
          </span>
          <h1 class="prog-title" id="progTitle">Opening your recording…</h1>
          <p class="prog-sub"><span class="prog-file" id="progressName"></span><span class="sep" id="hintSep" aria-hidden="true">·</span><span id="progressHint"></span></p>
          <ol class="stages" id="stages" aria-label="Steps"></ol>
          <p class="prog-detail" id="progressMsg" aria-live="polite"></p>
          <p class="prog-error" id="errorText" role="alert" hidden></p>
          <div class="prog-actions">
            <button class="btn ghost" id="cancelBtn" type="button">Cancel</button>
            <button class="btn ghost" id="otherBtn" type="button" hidden>Choose another file</button>
            <button class="btn primary" id="retryBtn" type="button" hidden>Try again</button>
          </div>
        </div>
      </section>

      <!-- Result -->
      <section class="view view-result" id="viewResult" hidden aria-label="Result">
        <div class="res-head">
          <p class="eyebrow">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l2.9 2.9 5.6-5.8"/></svg>
            Your MIDI file is ready
          </p>
          <h1 class="res-title" id="resultName"></h1>
          <p class="res-stats" id="resultMeta"></p>
          <a class="save" id="downloadBtn" href="#" download>
            <svg class="i-save" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>
            <svg class="i-done" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            <span id="saveLabel">Save MIDI</span>
          </a>
          <div class="res-links">
            <button class="link-btn" id="newBtn" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              Convert another
            </button>
            <span class="dotsep" aria-hidden="true"></span>
            <button class="link-btn" id="optsResult" type="button" aria-haspopup="dialog" aria-controls="drawer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>
              Options
            </button>
          </div>
        </div>

        <div class="preview" role="group" aria-label="Preview">
          <div class="preview-bar">
            <button class="play" id="playBtn" type="button" aria-pressed="false">
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2A.8.8 0 0 0 8 5.8z"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5.5" width="3.6" height="13" rx="1"/><rect x="13.4" y="5.5" width="3.6" height="13" rx="1"/></svg>
              <span id="playLabel">Play preview</span>
            </button>
            <span class="time" id="timeLabel">0:00 / 0:00</span>
            <div class="mix-wrap">
              <span class="mix-label" id="mixLabel">Listen to</span>
              <div class="seg seg-mix" role="radiogroup" aria-labelledby="mixLabel" id="mixSeg">
                <button type="button" role="radio" data-mix="original" aria-checked="false" tabindex="-1" title="Hear the recording">Original</button>
                <button type="button" role="radio" data-mix="both" aria-checked="true" tabindex="0" title="Hear the recording and the MIDI together">Both</button>
                <button type="button" role="radio" data-mix="midi" aria-checked="false" tabindex="-1" title="Hear the MIDI on a grand piano">MIDI</button>
              </div>
            </div>
            <span class="spacer"></span>
            <span class="pstatus" id="pianoStatus" aria-live="polite"></span>
            <div class="zoom" role="group" aria-label="Zoom">
              <button class="icon-btn" id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
              <button class="icon-btn" id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
            </div>
          </div>
          <div class="roll" id="roll"></div>
          <p class="preview-hint">Hover a note to see what it is · Click to jump there · Space plays and pauses</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Options -->
  <div class="scrim" id="scrim" hidden></div>
  <section class="dialog" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden inert>
    <header class="dlg-head">
      <h2 id="drawerTitle">Options</h2>
      <button class="icon-btn" id="closeAdvanced" type="button" aria-label="Close options"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </header>
    <div class="dlg-body" id="dlgBody"></div>
    <footer class="dlg-foot">
      <button class="link-btn more-btn" id="moreBtn" type="button" aria-expanded="false" aria-controls="dlgBody">
        <span id="moreLabel">More settings</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
      </button>
      <span class="spacer"></span>
      <button class="btn ghost" id="resetBtn" type="button">Reset to defaults</button>
      <button class="btn primary" id="doneBtn" type="button">Done</button>
    </footer>
  </section>

  <div class="drop-overlay" id="dropOverlay" hidden><div>Let go to convert</div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
